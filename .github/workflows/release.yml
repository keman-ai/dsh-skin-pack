name: Build & Release

# The skins have no dependencies on each other and a full build of all packages takes ~3s, so there is no incremental build —
# the complexity would buy nothing. What genuinely needs to touch only what changed is publishing:
# scripts/release.mjs decides what to publish by whether a version already has a matching Release tag,
# and skips any package whose version was not bumped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a Release needs write access
    steps:
      - uses: actions/checkout@v4

      # No version here: pnpm/action-setup also reads packageManager from package.json,
      # and setting both makes it fail with "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The consistency gate runs before the build: mismatched ids and entries missing from files
      # are invisible to the build and only surface once a user installs and finds the skin will not switch on.
      - name: Verify
        run: pnpm verify

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # Whether the build output is complete decides whether the market rolls the install back, so it gets its own check
      - name: Assert build outputs
        run: |
          missing=0
          for dir in packages/*/; do
            for entry in lib/index.js lib/client.js; do
              if [ ! -f "$dir$entry" ]; then
                echo "::error::${dir}${entry} does not exist"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Release changed packages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
